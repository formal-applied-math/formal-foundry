# Autoformalizer pipeline — cadence + token budget.
# Read by pipeline.py / pipeline_lib.PipelineConfig. The GitHub Actions cron
# fires one tick every `interval_days`; each tick runs at most `max_issues_per_tick`
# issue(s), charging the per-issue cap against a monthly allowance (conservative:
# the cap is charged whether or not the attempt spends it, so the allowance is a
# hard ceiling on issues/month, not an estimate).
#
# Cadence: 1 issue / 2 days (2026-08-03, was 3). The binding constraint is the
# 2000-min/month Actions quota, not tokens — ~15 ticks at 46-85 min each leaves
# about half the quota for hands-on workflow_dispatch runs, which measured 85% of
# the spend. Sizing: allowance 8M / cap 500k → ≤16 issues/month, just clear of the
# ~15 the cadence can produce, so the ceiling stops a runaway without binding
# normal cadence. NOTE it is inert in practice: the live vibe path reports
# `"tokens": 0` (`vibe_prove.py`), so `record` charges 0 and `can_afford` never
# trips — real token capture is harvest item T2.
# difficulty:hard issues escalate to escalate_hard_cap.

[pipeline]
interval_days = 2
monthly_token_allowance = 8000000
tokens_per_issue_cap = 500000
escalate_hard_cap = 2000000
max_issues_per_tick = 1
reasoning_effort = "high"

# vibe ⇄ lean-lsp-mcp harness (the cron prove path since 2026-07-17): one deep
# headless agentic session per target, bounded by TURNS (depth over breadth).
# Leanstral drives lean_goal / lean_multi_attempt / search itself, so more turns
# = more repair depth. (This lever replaced the retired text-loop's
# fanout × tokens_per_attempt budget.)
# Phase 3.2 depth retune (2026-07-18): the vibe path already IS the depth side of the
# Delta/Numina depth>breadth finding (fanout=1, all budget in one deep session). The
# live realization of "more depth at equal total spend" is more TURNS under the same
# per-issue token ceiling (tokens_per_issue_cap, unchanged): 40 -> 60. Watched via the
# obstruction report's prover-max-rounds family; one-line revert if outcomes worsen.
# (The evidence's fanout=2 refinement needs two parallel Lean sessions = the Phase 3.1
# pool on a big box, so it is a CI-only experiment, not a local flip — see upgrade-backlog.)
max_turns = 60

# Issue -> stub autoformalizer (the self-feeding refill phase). When the queue has
# no unattempted target, the tick drafts one from the next `status:ready`+`type:proof`
# issue: claude drafts+judges+roundtrips a faithful stub, leanstral runs the
# kernel gates (hypothesis-rejection + disproof), the existing prover proves it.
# `enabled = false` reverts to a hand-seeded queue. `budget` caps the claude +
# gate tokens per refill; `max_attempt_issues` bounds skip-to-next on rejects.
# Design: docs/superpowers/specs/2026-07-12-issue-to-stub-autoformalizer-design.md.
[autoformalize]
enabled = true
budget = 400000
max_issues = 1
max_attempt_issues = 3
gate_budget = 20000
prover_model = "labs-leanstral-1-5"   # leanstral: the kernel gate battery (vacuity / disproof)
formalize_rounds = 3       # round-count cited in formalize-miss telemetry (agentic self-iterates)
retrieval = true           # feed embedding-retrieved premises into the agentic drafter prompt
depth_gate = true          # pointers-scoped depth gate: reject a true-but-shallow stub whose
                           # TYPE consumes no def from its `-- pointers:` MathFin modules (a
                           # Mathlib identity in domain clothing — cal-bk-67 inlined the forward
                           # rate as `let`s over raw reals instead of consuming MathFin.zcb).
                           # No pointers ⇒ inapplicable ⇒ skipped.
retrieval_backend = "embedding"  # "embedding" (pin-accurate types.jsonl cosine, whole-corpus
                           # semantic reach) | "loogle" (name-based reactive only). Falls open to
                           # loogle when the embedding cache is absent.
retrieval_k = 8            # top-k premises surfaced per query (formalize grounding + prove context)
embed_model = "mistral-embed"    # Mistral /v1/embeddings model id (build cache: scripts/build-embeddings.sh)
# semantic repair cascade (docs/superpowers/specs/2026-07-17-semantic-repair-cascade-design.md):
# a semantic-gate rejection (shallow / trivial / vacuous / false / unfaithful) is fed
# back — rejected stub + gate verdict + repair direction — and the issue is RE-DRAFTED, both
# stages seeing the feedback, up to semantic_rounds total attempts. 1 = old terminal-skip.
semantic_rounds = 2
triviality_gate = true     # splice `first | rfl | simp` over the sorry at draft time: a clean
                           # close means a definitional restatement with no content (the
                           # cal-bk-67 class, caught before prove-compute instead of at open-pr)
# NOTE: the intent-fidelity gate was RETIRED 2026-07-29 (A/B: drift fired 0/62 in telemetry +
# a clean off-arm run — it never caught anything the issue->stub faithfulness judge missed).
state_cache = true         # the same content-addressing one level DOWN: record the intermediate
                           # states of an accepted proof plus the tactic that advanced each, keyed
                           # by a normalized goal (metavariable numbering and inaccessible-name
                           # daggers collapsed — a raw hash of goal text almost never hits).
                           # ON here to MEASURE: the gate phase extracts states from every pass, on
                           # a daemon it already owns, and writes runs/state-cache.json +
                           # runs/proof-states.jsonl. Consumption is self-gating — suggestions()
                           # renders only states two DIFFERENT targets reached, so until that
                           # number is nonzero the prover's prompt is unchanged. Read it with
                           # `python3 vibe_prove.py states`. If cross-target recurrence stays 0
                           # after a few ticks, this is ceremony and comes back out.
gate_cache = true          # item L: content-address the adversarial gate goals (vacuity/disproof)
                           # and substitute the cached verdict on a hit — 0 tokens, no daemon
                           # call — across attempts + ticks (the persist step commits runs/, so
                           # runs/gate-cache.json survives run to run). safe: a refutation is
                           # deterministic (the statement pin blocks a reverted-goal false
                           # positive); CACHE_GENERATION invalidates on a Mathlib/Lean pin bump.

# Lemma-DAG decomposition (Phase 2 — docs/superpowers/specs/2026-07-18-decomposer-design.md).
# The drafter (Claude) SPLITS a hard target into a few named leaf lemmas + a
# main theorem applying them; a Lean-side skeleton gate rejects a bad split for one
# elaboration's cost BEFORE any leaf gets proving budget; leaves reuse the vibe prover
# verbatim as ordinary single-sorry targets; a recomposition gate assembles the whole.
# `enabled` gates the whole path. When ON, the tick routes to decompose in three ways:
#   1. a workflow_dispatch `decompose=true` one-shot (forces the CI-selected target);
#   2. a target tagged `decompose` (a `-- decompose` stub header);
#   3. AUTONOMOUS ESCALATION (R decision 2026-07-18, corrected from "difficulty:hard" —
#      the ready+proof backlog has no hard issues; the real signal is failure): a plain
#      attempt that can't close the target (max_rounds/fail_gate) escalates that same
#      target to decompose. So CI decides to decompose exactly what plain proving fails on.
[decompose]
enabled = true
max_leaves = 3             # tight splits first; a DAG wanting more is usually mis-shaped (raise on evidence)
leaf_max_turns = 40        # vibe turns per leaf (leaves are individually short by design)
max_reask = 1              # bounded re-decompose rounds on a malformed DAG or a failed skeleton gate

# the drafter: Claude drafts the intent, formalizes agentically (claude -p + lean-lsp,
# self-validating to elaboration), and judges; Leanstral PROVES. No magistral, no completion
# path. Needs CLAUDE_CODE_OAUTH_TOKEN (or ANTHROPIC_API_KEY / a local ~/.claude login); with
# no auth the drafts defer. The only knob is which Claude model drafts.
[drafter]
claude_model = "claude-sonnet-5"
