# Autoformalizer pipeline — cadence + token budget.
# Read by pipeline.py / pipeline_lib.PipelineConfig. The GitHub Actions cron
# fires one tick every `interval_days`; each tick runs at most `max_issues_per_tick`
# issue(s), charging the per-issue cap against a monthly allowance (conservative:
# the cap is charged whether or not the attempt spends it, so the allowance is a
# hard ceiling on issues/month, not an estimate).
#
# Sizing: allowance 8M / cap 500k → ≤16 issues/month; at 1 issue / 3 days that's
# ~10/month, so the ceiling protects against runaway/manual triggers without
# binding normal cadence. difficulty:hard issues escalate to escalate_hard_cap.

[pipeline]
interval_days = 3
monthly_token_allowance = 8000000
tokens_per_issue_cap = 500000
escalate_hard_cap = 2000000
max_issues_per_tick = 1
reasoning_effort = "high"

# vibe ⇄ lean-lsp-mcp harness (the cron prove path since 2026-07-17): one deep
# headless agentic session per target, bounded by TURNS (depth over breadth).
# Leanstral drives lean_goal / lean_multi_attempt / search itself, so more turns
# = more repair depth. (This lever replaced the retired text-loop's
# fanout × tokens_per_attempt budget.)
max_turns = 40

# Issue -> stub autoformalizer (the self-feeding refill phase). When the queue has
# no unattempted target, the tick drafts one from the next `status:ready`+`type:proof`
# issue: magistral drafts+judges+roundtrips a faithful stub, leanstral runs the
# kernel gates (hypothesis-rejection + disproof), the existing prover proves it.
# `enabled = false` reverts to a hand-seeded queue. `budget` caps the magistral +
# gate tokens per refill; `max_attempt_issues` bounds skip-to-next on rejects.
# Design: docs/superpowers/specs/2026-07-12-issue-to-stub-autoformalizer-design.md.
[autoformalize]
enabled = true
budget = 400000
max_issues = 1
max_attempt_issues = 3
gate_budget = 20000
prover_model = "labs-leanstral-1-5"
draft_max_tokens = 16000   # reasoning headroom — magistral emits a think trace before the code
# two-stage draft: magistral SPECIFIES the intended statement in prose (its strength),
# leanstral FORMALIZES it into elaborating Lean (its strength). draft failures were Lean
# failures (unknown identifiers, let-scoping, coercions), so the Lean writing moves to the
# Lean model. intent_model is the strongest Magistral reasoning tier (Medium 1.2 / 2509).
intent_model = "magistral-medium-latest"
formalize_model = "labs-leanstral-1-5"
formalize_rounds = 3       # leanstral formalize + compiler-feedback repair rounds
formalize_token_budget = 40000  # early-abort a doomed formalization (a hard issue like #61 else
                                # burns ~77k tokens/draw grinding every round without elaborating)
retrieval = true           # on `unknown identifier X`, feed loogle candidates back (elaboration-gated)
depth_gate = true          # pointers-scoped depth gate: reject a true-but-shallow stub whose
                           # TYPE consumes no def from its `-- pointers:` MathFin modules (a
                           # Mathlib identity in domain clothing — cal-bk-67 inlined the forward
                           # rate as `let`s over raw reals instead of consuming MathFin.zcb).
                           # No pointers ⇒ inapplicable ⇒ skipped.
retrieval_backend = "embedding"  # "embedding" (pin-accurate types.jsonl cosine, whole-corpus
                           # semantic reach) | "loogle" (name-based reactive only). Falls open to
                           # loogle when the embedding cache is absent.
retrieval_k = 8            # top-k premises surfaced per query (formalize grounding + prove context)
embed_model = "mistral-embed"    # Mistral /v1/embeddings model id (build cache: scripts/build-embeddings.sh)
# semantic repair cascade (docs/superpowers/specs/2026-07-17-semantic-repair-cascade-design.md):
# a semantic-gate rejection (shallow / trivial / vacuous / false / unfaithful / drift) is fed
# back — rejected stub + gate verdict + repair direction — and the issue is RE-DRAFTED, both
# stages seeing the feedback, up to semantic_rounds total attempts. 1 = old terminal-skip.
semantic_rounds = 2
triviality_gate = true     # splice `first | rfl | simp` over the sorry at draft time: a clean
                           # close means a definitional restatement with no content (the
                           # cal-bk-67 class, caught before prove-compute instead of at open-pr)

# Lemma-DAG decomposition (Phase 2 — docs/superpowers/specs/2026-07-18-decomposer-design.md).
# The general reasoner (Magistral) SPLITS a hard target into a few named leaf lemmas + a
# main theorem applying them; a Lean-side skeleton gate rejects a bad split for one
# elaboration's cost BEFORE any leaf gets proving budget; leaves reuse the vibe prover
# verbatim as ordinary single-sorry targets; a recomposition gate assembles the whole.
# OFF BY DEFAULT and TAG-ONLY (R decision 2026-07-18): only a target tagged `decompose`
# (a `-- decompose` stub header) takes this path — never a plain cron target. `enabled`
# gates the whole path, so the running cron is byte-identical until it is flipped on.
[decompose]
enabled = false
max_leaves = 3             # tight splits first; a DAG wanting more is usually mis-shaped (raise on evidence)
leaf_max_turns = 40        # vibe turns per leaf (leaves are individually short by design)
max_reask = 1              # bounded re-decompose rounds on a malformed DAG or a failed skeleton gate
