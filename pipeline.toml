# Autoformalizer pipeline — cadence + token budget.
# Read by pipeline.py / pipeline_lib.PipelineConfig. The GitHub Actions cron
# fires one tick every `interval_days`; each tick runs at most `max_issues_per_tick`
# issue(s), charging the per-issue cap against a monthly allowance (conservative:
# the cap is charged whether or not the attempt spends it, so the allowance is a
# hard ceiling on issues/month, not an estimate).
#
# Sizing: allowance 8M / cap 500k → ≤16 issues/month; at 1 issue / 3 days that's
# ~10/month, so the ceiling protects against runaway/manual triggers without
# binding normal cadence. difficulty:hard issues escalate to escalate_hard_cap.

[pipeline]
interval_days = 3
monthly_token_allowance = 8000000
tokens_per_issue_cap = 500000
escalate_hard_cap = 2000000
max_issues_per_tick = 1
reasoning_effort = "high"

# pass@k harness knobs. The per-issue cap is spent as ~`fanout` whole-proof
# attempts x `tokens_per_attempt`, then <=`repair_rounds` compiler-feedback
# repairs on the best failure. Research basis: Kimina sample-efficiency knee at
# ~pass@32, Goedel self-correction ablation at ~2 repair rounds, Leanstral's
# dominant lever is tokens-per-attempt (PutnamBench 44→244→493→587 solves at
# 50k→200k→1M→4M).
# Shape (2026-07-11): fewer, bigger attempts. 4 x 120k ≈ the 500k cap in the
# primary round (was 8 x 60k), shifting weight onto the tokens-per-attempt lever
# per Leanstral's curve while keeping pass@4 diversity; repair still funds
# escalated hard targets (2M cap). Retune toward 2 x 250k to push the per-attempt
# lever harder once MathFin-Bench measures the knee on our distribution.
fanout = 4
repair_rounds = 2
tokens_per_attempt = 120000
