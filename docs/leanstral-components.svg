<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="850" viewBox="0 0 1200 850" font-family="'Helvetica Neue',Helvetica,Arial,sans-serif">
  <defs>
    <marker id="a" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7.5" markerHeight="7.5" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#8a929e"/></marker>
    <marker id="as" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7.5" markerHeight="7.5" orient="auto"><path d="M0 0L10 5L0 10z" fill="#8a929e"/></marker>
    <style>
      .clab{font-size:12px;font-weight:700;letter-spacing:.06em;}
      .nt{font-size:13.5px;font-weight:700;fill:#1b2330;}
      .nd{font-size:11.5px;fill:#5c6675;}
      .mono{font-family:'SF Mono',Menlo,Consolas,monospace;}
      .el{font-size:11px;fill:#5c6675;}
      .elk{font-size:11px;fill:#2f5fd0;}
      .edge{fill:none;stroke:#8a929e;stroke-width:1.6;}
      .edb{fill:none;stroke:#2f5fd0;stroke-width:1.6;}
    </style>
  </defs>
  <rect width="1200" height="850" fill="#ffffff"/>
  <text x="600" y="32" text-anchor="middle" font-size="16.5" font-weight="700" fill="#1b2330">Leanstral formalization harness — components &amp; interactions</text>

  <!-- ============ LEFT: operator + GitHub repo ============ -->
  <rect x="36" y="56" width="300" height="72" rx="11" fill="#f2f4f7" stroke="#d5dae1"/>
  <text x="52" y="80" class="nt">OPERATOR (R)</text>
  <text x="52" y="100" class="nd">authors statements · runs the harness</text>
  <text x="52" y="116" class="nd">refinery · opens PRs</text>

  <rect x="36" y="160" width="300" height="404" rx="13" fill="#eef4f0" stroke="#cadfd0"/>
  <text x="52" y="184" class="clab" fill="#1c8f5f">GITHUB · formal-mathfin (public library)</text>
  <rect x="56" y="198" width="260" height="66" rx="9" fill="#ffffff" stroke="#d5dae1"/>
  <text x="70" y="222" class="nt">roadmap issues</text>
  <text x="70" y="242" class="nd"><tspan class="mono">status:ready</tspan> = target queue</text>
  <rect x="56" y="278" width="260" height="72" rx="9" fill="#ffffff" stroke="#d5dae1"/>
  <text x="70" y="302" class="nt">Lean library + benchmarks</text>
  <text x="70" y="322" class="nd">Mathlib + BrownianMotion sources</text>
  <text x="70" y="338" class="nd"><tspan class="mono">MathFin/</tspan> · the target files live here</text>
  <rect x="56" y="364" width="260" height="52" rx="9" fill="#ffffff" stroke="#d5dae1"/>
  <text x="70" y="388" class="nt"><tspan class="mono">.env</tspan> key + toolchain pins</text>
  <text x="70" y="406" class="nd">API key · Lean/Mathlib/BM revs</text>
  <rect x="56" y="430" width="260" height="50" rx="9" fill="#ffffff" stroke="#d5dae1"/>
  <text x="70" y="454" class="nt">pull requests → main</text>
  <text x="70" y="470" class="nd">the accepted, refined proofs</text>

  <!-- ============ CENTER SPINE ============ -->
  <!-- Leanstral (cloud) -->
  <rect x="452" y="52" width="296" height="70" rx="11" fill="#fdf3ee" stroke="#e6b892"/>
  <text x="600" y="80" text-anchor="middle" class="nt" fill="#d9611e">LEANSTRAL</text>
  <text x="600" y="102" text-anchor="middle" class="nd">labs-leanstral-1-5  ·  Mistral API (remote)</text>

  <!-- Foundry cluster -->
  <rect x="392" y="176" width="416" height="268" rx="13" fill="#fbf5f0" stroke="#ecd6c3"/>
  <text x="408" y="200" class="clab" fill="#d9611e">FOUNDRY · mathfin-foundry (local, private)</text>
  <rect x="410" y="212" width="380" height="52" rx="9" fill="#ffffff" stroke="#d5dae1"/>
  <text x="424" y="234" class="nt"><tspan class="mono">house_context</tspan> → doctrine</text>
  <text x="424" y="252" class="nd">values · idioms · pins · per-target context pack</text>
  <rect x="410" y="290" width="184" height="140" rx="9" fill="#ffffff" stroke="#d5dae1"/>
  <text x="424" y="314" class="nt"><tspan class="mono">probe.py</tspan></text>
  <text x="424" y="334" class="nd">text-loop harness</text>
  <text x="424" y="350" class="nd">(calibration)</text>
  <text x="424" y="372" class="nd">prompt → extract →</text>
  <text x="424" y="388" class="nd">compile → repair</text>
  <rect x="606" y="290" width="184" height="140" rx="9" fill="#ffffff" stroke="#d5dae1"/>
  <text x="620" y="314" class="nt"><tspan class="mono">vibe</tspan> + launcher</text>
  <text x="620" y="334" class="nd">agentic harness</text>
  <text x="620" y="350" class="nd">(production)</text>
  <text x="620" y="372" class="nd"><tspan class="mono">leanstral-vibe.sh</tspan></text>
  <text x="620" y="388" class="nd">drives the LSP tools</text>

  <!-- Docker cluster -->
  <rect x="392" y="556" width="416" height="256" rx="13" fill="#eef3fc" stroke="#c6d5f0"/>
  <text x="408" y="580" class="clab" fill="#2f5fd0">DOCKER · one Lean process · memory-capped 6 GB</text>
  <rect x="410" y="592" width="184" height="86" rx="9" fill="#ffffff" stroke="#d5dae1"/>
  <text x="424" y="616" class="nt"><tspan class="mono">lean-repl</tspan> daemon</text>
  <text x="424" y="636" class="nd">checks a code blob</text>
  <text x="424" y="652" class="nd">TCP <tspan class="mono">:7878</tspan></text>
  <rect x="606" y="592" width="184" height="86" rx="9" fill="#ffffff" stroke="#d5dae1"/>
  <text x="620" y="616" class="nt"><tspan class="mono">lean-lsp</tspan></text>
  <text x="620" y="636" class="nd"><tspan class="mono">lean-lsp-mcp</tspan></text>
  <text x="620" y="652" class="nd">+ the Lean LSP</text>
  <rect x="410" y="702" width="380" height="56" rx="9" fill="#ffffff" stroke="#d5dae1"/>
  <text x="424" y="726" class="nt"><tspan class="mono">oleans</tspan> · lake_build_cache volume</text>
  <text x="424" y="744" class="nd">the library's prebuilt build artifacts (reused)</text>

  <!-- ============ RIGHT: notes ============ -->
  <rect x="864" y="176" width="300" height="86" rx="11" fill="#f7f8fa" stroke="#d5dae1"/>
  <text x="880" y="200" class="nt">One Lean process</text>
  <text x="880" y="220" class="nd"><tspan class="mono">lean-repl</tspan> ⊕ <tspan class="mono">lean-lsp</tspan> — the launcher takes the</text>
  <text x="880" y="236" class="nd">daemon down before a vibe session, and both</text>
  <text x="880" y="252" class="nd">reuse the same olean volume.</text>
  <rect x="864" y="278" width="300" height="70" rx="11" fill="#f7f8fa" stroke="#d5dae1"/>
  <text x="880" y="302" class="nt">Model is remote</text>
  <text x="880" y="322" class="nd">the 119B model runs on Mistral's servers;</text>
  <text x="880" y="338" class="nd">only the ~5 GB Lean env is local.</text>
  <rect x="864" y="364" width="300" height="70" rx="11" fill="#f7f8fa" stroke="#d5dae1"/>
  <text x="880" y="388" class="nt">Scout, not author</text>
  <text x="880" y="408" class="nd">a machine proof passes the values gate + an</text>
  <text x="880" y="424" class="nd">8-lens refinery before it becomes a PR.</text>

  <!-- ============ EDGES ============ -->
  <!-- Foundry <-> Leanstral -->
  <line x1="600" y1="174" x2="600" y2="124" class="edge" marker-end="url(#a)"/>
  <text x="612" y="152" class="el">prompt + doctrine  ↔  proof / tool-calls</text>

  <!-- house_context -> provers -->
  <line x1="502" y1="264" x2="502" y2="290" class="edge" marker-end="url(#a)"/>
  <line x1="698" y1="264" x2="698" y2="290" class="edge" marker-end="url(#a)"/>
  <text x="600" y="282" text-anchor="middle" class="el">inject doctrine</text>

  <!-- probe -> lean-repl -->
  <line x1="502" y1="430" x2="502" y2="592" class="edge" marker-start="url(#as)" marker-end="url(#a)"/>
  <text x="492" y="500" text-anchor="end" class="el">check a code blob</text>
  <text x="492" y="516" text-anchor="end" class="el">TCP :7878 → errors</text>

  <!-- vibe <-> lean-lsp -->
  <line x1="698" y1="430" x2="698" y2="592" class="edb" marker-start="url(#as)" marker-end="url(#a)"/>
  <text x="710" y="500" class="elk">MCP (docker exec)</text>
  <text x="710" y="516" class="elk"><tspan class="mono">lean_goal</tspan> · edit · diagnostics</text>

  <!-- lean-repl / lean-lsp -> oleans -->
  <line x1="502" y1="678" x2="502" y2="702" class="edge" marker-end="url(#a)"/>
  <line x1="698" y1="678" x2="698" y2="702" class="edge" marker-end="url(#a)"/>
  <text x="600" y="695" text-anchor="middle" class="el">read oleans</text>

  <!-- R -> foundry (run) -->
  <line x1="336" y1="96" x2="470" y2="205" class="edge" marker-end="url(#a)"/>
  <text x="360" y="150" class="el">runs the harness</text>

  <!-- issues -> foundry (target + pins) -->
  <line x1="316" y1="230" x2="392" y2="300" class="edge" marker-end="url(#a)"/>
  <text x="326" y="262" class="el"><tspan class="mono">status:ready</tspan> → target</text>
  <text x="326" y="278" class="el">+ key &amp; pins</text>

  <!-- library <-> docker (bind mount) -->
  <line x1="316" y1="330" x2="392" y2="640" class="edge" marker-start="url(#as)" marker-end="url(#a)"/>
  <text x="326" y="470" class="el">bind-mount → <tspan class="mono">/app</tspan></text>
  <text x="326" y="486" class="el">(the target file)</text>

  <!-- foundry/R -> PRs (refinery) : from foundry left down to PRs -->
  <path d="M392 420 C 360 460, 340 470, 316 455" class="edge" marker-end="url(#a)"/>
  <text x="326" y="430" class="el">accepted → refinery → PR</text>
</svg>
