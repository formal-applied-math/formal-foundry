<svg xmlns="http://www.w3.org/2000/svg" width="1680" height="700" viewBox="0 0 1680 700" font-family="'Helvetica Neue',Helvetica,Arial,sans-serif">
  <defs>
    <marker id="a" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7.5" markerHeight="7.5" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#8a929e"/></marker>
    <marker id="ab" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7.5" markerHeight="7.5" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#2f5fd0"/></marker>
    <style>
      .clab{font-size:12px;font-weight:700;letter-spacing:.05em;}
      .nt{font-size:13.5px;font-weight:700;fill:#1b2330;}
      .nd{font-size:11.5px;fill:#5c6675;}
      .mono{font-family:'SF Mono',Menlo,Consolas,monospace;}
      .el{font-size:11px;fill:#5c6675;}
      .elk{font-size:11px;fill:#2f5fd0;}
      .edge{fill:none;stroke:#8a929e;stroke-width:1.6;}
      .edb{fill:none;stroke:#2f5fd0;stroke-width:1.6;}
      .note-t{font-size:12.5px;font-weight:700;fill:#6b7280;}
      .note-d{font-size:11px;fill:#8a929e;}
    </style>
  </defs>
  <rect width="1680" height="700" fill="#ffffff"/>
  <text x="700" y="34" text-anchor="middle" font-size="16.5" font-weight="700" fill="#1b2330">Leanstral formalization harness — components &amp; interactions</text>

  <!-- OPERATOR (top-left) -->
  <rect x="50" y="54" width="300" height="58" rx="11" fill="#f2f4f7" stroke="#d5dae1"/>
  <text x="68" y="78" class="nt">OPERATOR (R)</text>
  <text x="68" y="98" class="nd">authors statements · runs harness · opens PRs</text>

  <!-- LEANSTRAL (top-center, above Foundry) -->
  <rect x="505" y="54" width="330" height="58" rx="11" fill="#fdf3ee" stroke="#e6b892"/>
  <text x="670" y="78" text-anchor="middle" class="nt" fill="#d9611e">LEANSTRAL</text>
  <text x="670" y="98" text-anchor="middle" class="nd">labs-leanstral-1-5  ·  Mistral API (remote)</text>

  <!-- ===== GITHUB (left) ===== -->
  <rect x="50" y="170" width="330" height="356" rx="13" fill="#eef4f0" stroke="#cadfd0"/>
  <text x="66" y="194" class="clab" fill="#1c8f5f">GITHUB · formal-mathfin (public)</text>
  <rect x="68" y="208" width="294" height="58" rx="9" fill="#ffffff" stroke="#d5dae1"/>
  <text x="82" y="231" class="nt">roadmap issues</text>
  <text x="82" y="251" class="nd"><tspan class="mono">status:ready</tspan> = target queue</text>
  <rect x="68" y="280" width="294" height="72" rx="9" fill="#ffffff" stroke="#d5dae1"/>
  <text x="82" y="303" class="nt">Lean library + benchmarks</text>
  <text x="82" y="323" class="nd">Mathlib + BrownianMotion sources</text>
  <text x="82" y="339" class="nd"><tspan class="mono">MathFin/</tspan> — the target files</text>
  <rect x="68" y="366" width="294" height="52" rx="9" fill="#ffffff" stroke="#d5dae1"/>
  <text x="82" y="388" class="nt"><tspan class="mono">.env</tspan> key + toolchain pins</text>
  <text x="82" y="406" class="nd">API key · Lean/Mathlib/BM revs</text>
  <rect x="68" y="432" width="294" height="52" rx="9" fill="#ffffff" stroke="#d5dae1"/>
  <text x="82" y="454" class="nt">pull requests → main</text>
  <text x="82" y="472" class="nd">the accepted, refined proofs</text>

  <!-- ===== FOUNDRY (center) ===== -->
  <rect x="460" y="170" width="420" height="420" rx="13" fill="#fbf5f0" stroke="#ecd6c3"/>
  <text x="476" y="194" class="clab" fill="#d9611e">FOUNDRY · mathfin-foundry (local, private)</text>
  <rect x="480" y="206" width="380" height="46" rx="9" fill="#ffffff" stroke="#d5dae1"/>
  <text x="494" y="227" class="nt"><tspan class="mono">house_context</tspan> → doctrine</text>
  <text x="494" y="245" class="nd">values · idioms · pins · per-target context pack</text>
  <rect x="500" y="270" width="360" height="136" rx="9" fill="#ffffff" stroke="#d5dae1"/>
  <text x="514" y="294" class="nt"><tspan class="mono">probe.py</tspan></text>
  <text x="514" y="314" class="nd">text-loop harness (calibration)</text>
  <text x="514" y="336" class="nd">prompt → extract →</text>
  <text x="514" y="352" class="nd">compile → repair</text>
  <text x="514" y="380" class="nd" font-style="italic">the calibration path</text>
  <rect x="500" y="430" width="360" height="136" rx="9" fill="#ffffff" stroke="#d5dae1"/>
  <text x="514" y="454" class="nt"><tspan class="mono">vibe</tspan> + launcher</text>
  <text x="514" y="474" class="nd">agentic harness (production)</text>
  <text x="514" y="496" class="nd"><tspan class="mono">leanstral-vibe.sh</tspan></text>
  <text x="514" y="512" class="nd">drives the LSP tools</text>
  <text x="514" y="540" class="nd" font-style="italic">the production path</text>

  <!-- ===== DOCKER (right) ===== -->
  <rect x="960" y="170" width="420" height="490" rx="13" fill="#eef3fc" stroke="#c6d5f0"/>
  <text x="976" y="194" class="clab" fill="#2f5fd0">DOCKER · one Lean process · memory-capped 6 GB</text>
  <rect x="980" y="270" width="380" height="110" rx="9" fill="#ffffff" stroke="#d5dae1"/>
  <text x="994" y="294" class="nt"><tspan class="mono">lean-repl</tspan> daemon</text>
  <text x="994" y="314" class="nd">checks a code blob over TCP <tspan class="mono">:7878</tspan></text>
  <text x="994" y="334" class="nd">returns errors + sorry-count</text>
  <rect x="980" y="430" width="380" height="110" rx="9" fill="#ffffff" stroke="#d5dae1"/>
  <text x="994" y="454" class="nt"><tspan class="mono">lean-lsp</tspan></text>
  <text x="994" y="474" class="nd"><tspan class="mono">lean-lsp-mcp</tspan> + the Lean LSP</text>
  <text x="994" y="494" class="nd">serves live goal states as MCP tools</text>
  <rect x="980" y="566" width="380" height="54" rx="9" fill="#ffffff" stroke="#d5dae1"/>
  <text x="994" y="588" class="nt"><tspan class="mono">oleans</tspan> · lake_build_cache volume</text>
  <text x="994" y="606" class="nd">the library's prebuilt artifacts (reused)</text>
  <text x="994" y="642" class="nd" font-style="italic">the library's MathFin/ is bind-mounted into this container at /app</text>

  <!-- ===== NOTES (far right) ===== -->
  <text x="1414" y="194" class="clab" fill="#97a0ad">NOTES</text>
  <rect x="1414" y="206" width="248" height="104" rx="10" fill="#f6f7f9"/>
  <text x="1432" y="230" class="note-t">One Lean process</text>
  <text x="1432" y="250" class="note-d"><tspan class="mono">lean-repl</tspan> ⊕ <tspan class="mono">lean-lsp</tspan> — the launcher</text>
  <text x="1432" y="266" class="note-d">takes the daemon down before a vibe</text>
  <text x="1432" y="282" class="note-d">session; both reuse the olean volume.</text>
  <rect x="1414" y="326" width="248" height="86" rx="10" fill="#f6f7f9"/>
  <text x="1432" y="350" class="note-t">Model is remote</text>
  <text x="1432" y="370" class="note-d">the 119B model runs on Mistral's</text>
  <text x="1432" y="386" class="note-d">servers; only ~5 GB Lean is local.</text>
  <rect x="1414" y="428" width="248" height="86" rx="10" fill="#f6f7f9"/>
  <text x="1432" y="452" class="note-t">Scout, not author</text>
  <text x="1432" y="472" class="note-d">a machine proof passes the values</text>
  <text x="1432" y="488" class="note-d">gate + an 8-lens refinery before PR.</text>

  <!-- ===== EDGES ===== -->
  <!-- R -> GitHub -->
  <line x1="195" y1="112" x2="195" y2="170" class="edge" marker-end="url(#a)"/>
  <!-- R -> Foundry -->
  <polyline points="350,84 410,84 410,192 460,192" class="edge" marker-end="url(#a)"/>
  <text x="416" y="130" class="el">runs the harness</text>

  <!-- Foundry <-> Leanstral -->
  <line x1="670" y1="170" x2="670" y2="112" class="edge" marker-end="url(#a)"/>
  <text x="682" y="146" class="el">prompt + doctrine  ↔  proof / tool-calls</text>

  <!-- issues -> Foundry -->
  <line x1="362" y1="234" x2="460" y2="234" class="edge" marker-end="url(#a)"/>
  <text x="411" y="226" text-anchor="middle" class="el">target + pins</text>

  <!-- house_context -> provers -->
  <line x1="600" y1="252" x2="600" y2="270" class="edge" marker-end="url(#a)"/>
  <polyline points="488,252 488,498 500,498" class="edge" marker-end="url(#a)"/>
  <text x="612" y="266" class="el">inject doctrine</text>

  <!-- probe -> lean-repl -->
  <line x1="860" y1="322" x2="980" y2="322" class="edge" marker-start="url(#a)" marker-end="url(#a)"/>
  <text x="920" y="308" text-anchor="middle" class="el">check code</text>
  <text x="920" y="356" text-anchor="middle" class="el">:7878 → errors</text>

  <!-- vibe <-> lean-lsp -->
  <line x1="860" y1="484" x2="980" y2="484" class="edb" marker-start="url(#ab)" marker-end="url(#ab)"/>
  <text x="920" y="470" text-anchor="middle" class="elk">MCP (docker exec)</text>
  <text x="920" y="518" text-anchor="middle" class="elk"><tspan class="mono">lean_goal</tspan> · edit</text>

  <!-- lean-repl / lean-lsp -> oleans -->
  <polyline points="1350,380 1350,566" class="edge" marker-end="url(#a)"/>
  <line x1="1170" y1="540" x2="1170" y2="566" class="edge" marker-end="url(#a)"/>
  <text x="1180" y="556" class="el">read oleans</text>

  <!-- Foundry -> PRs (accepted) -->
  <polyline points="460,498 412,498 412,458 362,458" class="edge" marker-end="url(#a)"/>
  <text x="372" y="450" class="el">accepted → PR</text>
</svg>
