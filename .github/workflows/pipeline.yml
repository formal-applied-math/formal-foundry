name: autoformalizer pipeline

# One token-paced tick every 2 days: pick a queued target (drafting one from the next
# ready issue when the queue is empty), prove it, and on a pass open a ready-for-review PR on the TARGET LIBRARY that
# closes the source issue (fully hands-off; R reviews + merges).
#
# Which library is the `domain` input (runbook 06): it names a pack under
# `domains/`, and `probe/domain_pack.py --export-env` resolves it into the DOMAIN_*
# env every step below reads. The scheduled run always ticks the flagship.
# Secrets:
#   CLAUDE_CODE_OAUTH_TOKEN — the drafter, the judge and the prover (`claude -p`).
#   MAIN_PR_TOKEN    — fine-grained PAT on the target library: Contents, Pull requests
#                      and Issues, each Read and write. WITHOUT it the tick falls back to
#                      candidate-notify and opens NO PR. With Contents alone it pushes
#                      the branch and then cannot open the PR (2026-09-28 .. 10-21,
#                      thirteen ticks). Revoking it disables auto-PR.
#   GHCR_TOKEN       — optional (read:packages; the image is public).
# The pipeline safely no-ops until R seeds stubs into targets/queue/.

on:
  schedule:
    # every 2 days, off-minute (not :00). Sized to the 2000-min/month Actions
    # quota: ~15 ticks at 46-85 min leaves ~half the quota for hands-on
    # workflow_dispatch runs, which are the larger share of the spend.
    # `*/2` on day-of-month restarts at the 1st, so a 31-day month fires on
    # consecutive days — the due check absorbs that (the 1st is <44h after
    # the 31st's stamp, so it skips for seconds and resyncs on the 3rd).
    - cron: "17 6 */2 * *"
  workflow_dispatch:
    inputs:
      force:
        description: "ignore the due (interval) check"
        type: boolean
        default: false
      decompose:
        description: "route the CI-selected target straight to the lemma-DAG decompose path (one-shot)"
        type: boolean
        default: false
      mtest_only:
        description: "validate the real-Lean gate tests (instance probe, map gate), then STOP — no tick, no tokens, no PR"
        type: boolean
        default: false
      domain:
        description: "domain pack to tick (a directory under domains/)"
        type: choice
        options: [mathfin, econometrics]
        default: mathfin

permissions:
  contents: write                  # commit state + telemetry back
  issues: write                    # open the refinery notification

concurrency:
  group: pipeline
  cancel-in-progress: false        # never interrupt a running proof

jobs:
  tick:
    runs-on: ubuntu-latest
    # A full tick is: the scout index on a pin change (~40 min), three cold daemon
    # loads, a draft session, a prove session, then the library's whole CI in the image
    # (build, shake, lint, regen, ledger, declaration index). 120 was sized for a tick
    # that reused a proof; the repo is public, so the minutes are not metered.
    timeout-minutes: 300
    env:
      # The scheduled run has no inputs, so it falls back to the flagship. Every
      # step that used to name the flagship reads DOMAIN_* out of the pack instead.
      DOMAIN: ${{ inputs.domain || 'mathfin' }}
    steps:
      - name: Free disk space
        # the in-image `lake exe cache get` + the library build (Mathlib
        # oleans ~5 GB + build artifacts) on top of the pulled verify image
        # overflows the runner's ~14 GB free disk. Reclaim the ~15 GB of
        # preinstalled toolchains we never use (Android SDK, .NET, GHC, Swift).
        run: |
          df -h / | tail -1
          sudo rm -rf /usr/local/lib/android /usr/share/dotnet /opt/ghc \
                      /usr/local/.ghcup /usr/local/share/boost /opt/hostedtoolcache/CodeQL \
                      /usr/local/lib/node_modules 2>/dev/null || true
          docker image prune -af >/dev/null 2>&1 || true
          echo "after cleanup:"; df -h / | tail -1

      - name: Checkout foundry
        uses: actions/checkout@v4

      - name: Resolve the domain pack
        # One place decides what this tick targets. Every later step reads these.
        run: |
          # `--format env` is REQUIRED here: $GITHUB_ENV is not shell-parsed, so the
          # shell-quoted form would put literal quotes inside every value.
          python3 probe/domain_pack.py --export-env "$DOMAIN" --format env >> "$GITHUB_ENV"
          echo "ISO_WEEK=$(date -u +%G-W%V)" >> "$GITHUB_ENV"
          echo "[domain] ticking $DOMAIN" >&2
          python3 probe/domain_pack.py --show "$DOMAIN" >&2

      - name: Checkout the target library (live pins; PR target)
        uses: actions/checkout@v4
        with:
          repository: ${{ env.MAIN_REPO_SLUG }}
          path: main
          fetch-depth: 0                 # full history so the autoform branch pushes cleanly
          # No token, nothing persisted: the library is public, and the prover and drafter
          # agents run in this checkout with read access to its files. The token used to
          # sit in main/.git/config; open-pr.sh now authenticates the one push it makes.
          persist-credentials: false

      - name: GHCR login (optional — image is public; login only eases rate limits)
        env:
          GHCR_TOKEN: ${{ secrets.GHCR_TOKEN }}
        run: |
          if [ -n "$GHCR_TOKEN" ]; then
            echo "$GHCR_TOKEN" | docker login ghcr.io -u raphaelrrcoelho --password-stdin
          else
            echo "no GHCR_TOKEN set — anonymous pull (the verify image is public)"
          fi

      - name: Pull the pinned verify image
        run: docker pull "$DOMAIN_VERIFY_IMAGE"

      - name: Setup Python                # the tick is host-side Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      # --- the lean_scout index (context packs, feasibility census) -------------
      # index/ is a gitignored build artifact, so CI rebuilds it here and caches it
      # by the LIBRARY source + pin — the key hashes the pack's own Lake root, not a
      # hardcoded `main/<Flagship>/**` that a second library would not have. On a
      # cache HIT (the common case) these steps are a fast restore; only a pin bump
      # or a library change rebuilds. The build runs BEFORE the daemon starts (it loads
      # the Lean env in its own container — one Lean process at a time) and is NON-FATAL:
      # a failure leaves index/ absent, the context packs fall back to reading the pointer
      # files, and the feasibility census fails open.
      - name: Restore lean_scout index (per-pin)
        id: index-cache
        uses: actions/cache@v4
        with:
          path: |
            index/types.jsonl
            index/const_dep.jsonl
            index/PIN
          # Keyed on the PINS and the ISO week, not on every library source file: the
          # library lands commits daily, so a key over its sources missed on every tick
          # and each tick spent ~36 minutes rebuilding an index that was at
          # most a few modules stale. A pin bump still rebuilds at once; otherwise the
          # index is refreshed weekly.
          key: ${{ env.DOMAIN_NAME }}-index-v2-${{ hashFiles('main/lean-toolchain', 'main/lake-manifest.json') }}-${{ env.ISO_WEEK }}

      - name: Build lean_scout index (cache miss only; non-fatal)
        if: steps.index-cache.outputs.cache-hit != 'true'
        continue-on-error: true
        env:
          MAIN_REPO: ${{ github.workspace }}/main
          VERIFY_CPUSET: "0-1"        # GitHub runners are 2-core; the local default 0-3 → docker exit 125
        run: bash scripts/build-index.sh

      - name: Place the lean-lsp compose in the main checkout
        # its bind mounts are relative, so it must sit in main/docker/ beside the
        # library root; the foundry carries the copy, so CI needs no push to that
        # repo's main for it.
        run: cp docker/docker-compose.lean-lsp.yml main/docker/docker-compose.lean-lsp.yml

      - name: Start the lean-repl daemon (compose — matches the tick's lean-lsp flip)
        env:
          COMPOSE_PROJECT_NAME: docker
          VERIFY_CPUSET: "0-1"            # 2-core runner (compose default 0-3 → docker exit 125)
        run: |
          # Compose-manage the daemon so the tick can flip the single Lean slot
          # daemon<->lean-lsp on the SAME project (stop/up, never down). On a fresh
          # runner the lake_build_cache volume auto-populates from the image's baked
          # /app/.lake on first mount (Docker volume semantics), so no seed step.
          docker compose -f main/docker/docker-compose.yml up -d lean-repl
          echo "probing 7878 until the daemon serves (cold Mathlib load ~5 min)…"
          # 35 minutes, not 10. The daemon builds whatever the library checkout holds
          # that the image does not, and the image is republished ~30 min AFTER a push
          # to the library: a run that starts inside that window rebuilds the changed
          # modules here. Run 43159501106 started 9 minutes before the new image landed
          # and ran out of the old 10 while the build was at 4881 of 5042.
          python3 probe/wait_daemon.py --tries 420 \
            || { echo "::error::daemon not ready"; docker logs docker-lean-repl-1 2>&1 | tail -60; exit 1; }

      - name: Gates on real Lean — instance probe, map gate (daemon warm, pre-tick)
        # The instance-probe gate's slip-catch depends on Lean/Mathlib behaviour
        # (`norm_num` evaluating a def against its intended value), so it needs the
        # daemon — the fast unit lane covers only the gate's parse logic. The daemon
        # is up + idle here (the tick has not claimed the slot yet), so this runs on
        # REAL Lean with no extra cold-load and reds the run BEFORE any token spend if
        # a pin bump regressed the catch. Light `norm_num` probes only (no heavy simp,
        # which OOM-crashed the REPL on the 10 GB box). `test_instance_probe_daemon.py`
        # self-skips when 7878 is not serving, so this is a no-op on any daemonless
        # future runner rather than a false red.
        run: |
          python3 -m pip show pytest >/dev/null 2>&1 || python3 -m pip install -q pytest
          cd probe && python3 -m pytest test_instance_probe_daemon.py -v
          # the map gate is a Lean meta block built as a string, and it reports through
          # one marked error: a block that stops elaborating would pass every statement
          # in silence. Both directions are checked on the library itself.
          python3 -m pytest test_map_gate_daemon.py -v

      - name: Provision Node (the disk-cleanup step wipes /usr/local/lib/node_modules → breaks npm)
        if: ${{ !inputs.mtest_only }}
        uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Install Claude Code CLI (the drafter, and the prover under [prover] engine="claude")
        if: ${{ !inputs.mtest_only }}
        # Pinned, and put FIRST on PATH. Unpinned, this step reported 2.1.197 on every run
        # while npm's latest moved on — some other `claude` on the runner was shadowing
        # the one installed here, so the version in use was neither chosen nor visible.
        # Bumped deliberately 2026-11-11, 2.1.197 → 2.1.322, with the models: `[prover]`
        # and `[drafter]` now name claude-sonnet-5-5, which postdates 2.1.197, and the
        # canary proves the pairing on every tick before a target is tried.
        env:
          CLAUDE_CODE_VERSION: "2.1.322"
        run: |
          npm install -g "@anthropic-ai/claude-code@${CLAUDE_CODE_VERSION}"
          echo "$(npm prefix -g)/bin" >> "$GITHUB_PATH"
          "$(npm prefix -g)/bin/claude" --version
          which -a claude || true

      - name: Run one pipeline tick (prove → on pass, open the PR)
        if: ${{ !inputs.mtest_only }}   # mtest_only dispatch validates item M then stops
        env:
          MAIN_PR_TOKEN: ${{ secrets.MAIN_PR_TOKEN }}
          # this repository's own token, for the `autoform-blocked` issue open-pr files
          # HERE: MAIN_PR_TOKEN is scoped to the library and has no rights on the foundry
          FOUNDRY_GH_TOKEN: ${{ github.token }}
          CLAUDE_CODE_OAUTH_TOKEN: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}   # frontier drafter (item I)
          MAIN_REPO_SLUG: ${{ env.MAIN_REPO_SLUG }}
          CI: "1"
          MAIN_REPO: ${{ github.workspace }}/main
          FOUNDRY_REPO: ${{ github.repository }}
          FORCE: ${{ inputs.force && '1' || '' }}
          DECOMPOSE_FORCE: ${{ inputs.decompose && '1' || '' }}   # one-shot: force the decompose path
          COMPOSE_PROJECT_NAME: docker    # the tick's daemon<->lean-lsp flip
          VERIFY_CPUSET: "0-1"            # share the 2-core cpuset with the daemon step
        run: bash scripts/pipeline-tick.sh

      - name: Persist state + telemetry
        if: always()
        # Redact before anything is committed: runs/ holds every agent transcript, i.e.
        # every tool result an agent saw, and this repository is public. The secrets are
        # in this step's env only so their exact values can be found and replaced.
        env:
          MAIN_PR_TOKEN: ${{ secrets.MAIN_PR_TOKEN }}
          CLAUDE_CODE_OAUTH_TOKEN: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
          GHCR_TOKEN: ${{ secrets.GHCR_TOKEN }}
          GITHUB_TOKEN: ${{ github.token }}
        run: |
          python3 probe/redact.py runs targets/queue docs/research/ab-decomposer.md pipeline_state.json
          git config user.name "pipeline-bot"
          git config user.email "pipeline@users.noreply.github.com"
          # targets/queue: a self-feeding tick autoformalizes a new stub + entry +
          # manifest into the queue; commit those alongside the state + telemetry.
          # docs/research/ab-decomposer.md: the decompose tick REGENERATES it from
          # runs/ab-decomposer.jsonl on every run, and omitting it here meant the
          # regeneration was discarded every time — the doc read "(no rows yet)" from
          # 2026-07-18 while seven decompose failures piled up in the log it is
          # generated from. It is the A/B evidence the 2026-09-30 decision gate reads.
          git add pipeline_state.json runs targets/queue \
                  docs/research/ab-decomposer.md 2>/dev/null || true
          git diff --cached --quiet && exit 0
          git commit -m "pipeline: state + telemetry + autoformalized targets [skip ci]"
          # The push must survive commits landing on main MID-RUN (2026-07-17: a
          # gate fix landed while a tick ran; `git push || true` swallowed the
          # rejection and orphaned cal-bk-85's state — one tick from a duplicate
          # PR). Rebase-and-retry; if it still cannot land, FAIL the step so the
          # orphaned state is a red run, not a silent one.
          for i in 1 2 3; do
            git push && exit 0
            echo "::warning::persist push rejected (attempt $i) — rebasing onto main and retrying"
            # --autostash: the tick leaves tracked files modified beyond the staged
            # state/runs/queue (scout index, caches, scratch), which otherwise make
            # `pull --rebase` abort with "cannot pull with rebase: You have unstaged
            # changes" — so a commit landing on main mid-run could never be rebased onto.
            git pull --rebase --autostash || true
          done
          echo "::error::persist push FAILED — this run's state/telemetry is NOT on main (recover from the pipeline-runs artifact)"
          exit 1

      # A green check has always meant "the machinery ran", never "the machinery
      # worked": the tick exits 0 on a target the prover cannot close, which is
      # correct — that is not an infrastructure error. The consequence was that the
      # loop ran from 2026-07-28 to 2026-09-01 producing NOTHING, five consecutive
      # max_rounds ticks, every run green, and nobody noticed for five weeks. One
      # barren tick is ordinary; a streak is a foundry that has stopped working.
      - name: Foundry health — is the loop still producing?
        if: always()
        # `shell: bash` is load-bearing: it runs with `-o pipefail`. The default shell does
        # not, so health.py's exit 1 was swallowed by `tee` — it printed STALLED on every
        # run from 2026-09-01 and the job stayed green.
        shell: bash
        run: |
          cd probe
          python3 health.py --state ../pipeline_state.json --ticks ../runs/ticks.jsonl \
            --fail-on-alarm | tee -a "$GITHUB_STEP_SUMMARY"

      - name: Upload telemetry
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: pipeline-runs
          path: runs/
          if-no-files-found: ignore
