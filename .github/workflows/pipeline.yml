name: autoformalizer pipeline

# One token-paced tick every 3 days: pick a queued target, prove it with
# Leanstral, and on a pass open a ready-for-review PR on formal-mathfin that
# closes the source issue (fully hands-off; R reviews + merges).
# Secrets:
#   MISTRAL_API_KEY  — the Leanstral endpoint.
#   MAIN_PR_TOKEN    — fine-grained PAT on formal-mathfin (contents:write +
#                      pull-requests:write). WITHOUT it the tick falls back to
#                      candidate-notify and opens NO PR. Revoking it disables auto-PR.
#   GHCR_TOKEN       — optional (read:packages; the image is public).
# The pipeline safely no-ops until R seeds stubs into targets/queue/.

on:
  schedule:
    - cron: "17 6 */3 * *"        # every 3 days, off-minute (not :00)
  workflow_dispatch:
    inputs:
      force:
        description: "ignore the due (interval) check"
        type: boolean
        default: false
      decompose:
        description: "route the CI-selected target straight to the lemma-DAG decompose path (one-shot)"
        type: boolean
        default: false

permissions:
  contents: write                  # commit state + telemetry back
  issues: write                    # open the refinery notification

concurrency:
  group: pipeline
  cancel-in-progress: false        # never interrupt a running proof

jobs:
  tick:
    runs-on: ubuntu-latest
    timeout-minutes: 120                # headroom for a pin-bump index+embedding rebuild
    steps:
      - name: Free disk space
        # the in-image `lake exe cache get` + `lake build MathFin` (Mathlib
        # oleans ~5 GB + build artifacts) on top of the pulled verify image
        # overflows the runner's ~14 GB free disk. Reclaim the ~15 GB of
        # preinstalled toolchains we never use (Android SDK, .NET, GHC, Swift).
        run: |
          df -h / | tail -1
          sudo rm -rf /usr/local/lib/android /usr/share/dotnet /opt/ghc \
                      /usr/local/.ghcup /usr/local/share/boost /opt/hostedtoolcache/CodeQL \
                      /usr/local/lib/node_modules 2>/dev/null || true
          docker image prune -af >/dev/null 2>&1 || true
          echo "after cleanup:"; df -h / | tail -1

      - name: Checkout foundry
        uses: actions/checkout@v4

      - name: Checkout MathFin (live pins; PR target — token gives push rights)
        uses: actions/checkout@v4
        with:
          repository: raphaelrrcoelho/formal-mathfin
          path: main
          fetch-depth: 0                 # full history so the autoform branch pushes cleanly
          token: ${{ secrets.MAIN_PR_TOKEN }}   # empty on forks / until R grants it → tick notifies, no PR

      - name: GHCR login (optional — image is public; login only eases rate limits)
        env:
          GHCR_TOKEN: ${{ secrets.GHCR_TOKEN }}
        run: |
          if [ -n "$GHCR_TOKEN" ]; then
            echo "$GHCR_TOKEN" | docker login ghcr.io -u raphaelrrcoelho --password-stdin
          else
            echo "no GHCR_TOKEN set — anonymous pull (mathfin-verify is public)"
          fi

      - name: Pull the pinned verify image
        run: docker pull ghcr.io/raphaelrrcoelho/mathfin-verify:latest

      - name: Setup Python                # needed by build-embeddings (host-side) + the tick
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Setup vibe                  # host-side CLI + the bundled lean agent
        # W5 spike: the `lean` agent is bundled in mistral-vibe; `/leanstall` only
        # writes installed_agents=["lean"] to the config. vibe runs on the RUNNER
        # (it docker-execs into the lean-lsp container), so no image rebuild is needed.
        run: bash scripts/vibe-setup.sh

      # --- embedding-retrieval corpus (Track A) ---------------------------------
      # index/ is a gitignored build artifact, so CI rebuilds it here and caches it
      # by the MathFin source + pin. On a cache HIT (the common case) these steps
      # are a fast restore; only a pin bump / MathFin change rebuilds. Both builds
      # run BEFORE the daemon starts (build-index loads the Lean env in its own
      # container — one Lean process at a time) and are NON-FATAL: any failure
      # leaves index/ absent and retrieval falls open to loogle (no tick regression).
      - name: Restore lean_scout index (per-pin)
        id: index-cache
        uses: actions/cache@v4
        with:
          path: |
            index/types.jsonl
            index/const_dep.jsonl
            index/PIN
          key: mathfin-index-v1-${{ hashFiles('main/lean-toolchain', 'main/lake-manifest.json', 'main/MathFin/**') }}

      - name: Build lean_scout index (cache miss only; non-fatal)
        if: steps.index-cache.outputs.cache-hit != 'true'
        continue-on-error: true
        env:
          MAIN_REPO: ${{ github.workspace }}/main
          VERIFY_CPUSET: "0-1"        # GitHub runners are 2-core; the local default 0-3 → docker exit 125
        run: bash scripts/build-index.sh

      - name: Restore embedding cache (per-pin, mistral-embed)
        id: embed-cache
        uses: actions/cache@v4
        with:
          path: index/embeddings-mistral-embed.json
          key: mathfin-embeddings-mistral-embed-v2-${{ hashFiles('main/lean-toolchain', 'main/lake-manifest.json', 'main/MathFin/**') }}

      - name: Build embedding cache (cache miss only; non-fatal)
        if: steps.embed-cache.outputs.cache-hit != 'true'
        continue-on-error: true
        env:
          MISTRAL_API_KEY: ${{ secrets.MISTRAL_API_KEY }}
        run: |
          if [ -f index/types.jsonl ]; then
            bash scripts/build-embeddings.sh
          else
            echo "no index/types.jsonl (index build skipped/failed) → embedding retrieval falls open to loogle"
          fi

      - name: Place the lean-lsp compose in the main checkout
        # its bind mounts are relative, so it must sit in main/docker/ beside MathFin/;
        # the foundry carries the copy, so CI needs no formal-mathfin main push for it.
        run: cp docker/docker-compose.lean-lsp.yml main/docker/docker-compose.lean-lsp.yml

      - name: Start the lean-repl daemon (compose — matches the tick's lean-lsp flip)
        env:
          COMPOSE_PROJECT_NAME: docker
          VERIFY_CPUSET: "0-1"            # 2-core runner (compose default 0-3 → docker exit 125)
        run: |
          # Compose-manage the daemon so the tick can flip the single Lean slot
          # daemon<->lean-lsp on the SAME project (stop/up, never down). On a fresh
          # runner the lake_build_cache volume auto-populates from the image's baked
          # /app/.lake on first mount (Docker volume semantics), so no seed step.
          docker compose -f main/docker/docker-compose.yml up -d lean-repl
          echo "probing 7878 until the daemon serves (cold Mathlib load ~5 min)…"
          python3 probe/wait_daemon.py \
            || { echo "::error::daemon not ready"; docker logs docker-lean-repl-1 2>&1 | tail -60; exit 1; }

      - name: Run one pipeline tick (prove → on pass, open the PR)
        env:
          MISTRAL_API_KEY: ${{ secrets.MISTRAL_API_KEY }}
          MAIN_PR_TOKEN: ${{ secrets.MAIN_PR_TOKEN }}
          MAIN_REPO_SLUG: raphaelrrcoelho/formal-mathfin
          CI: "1"
          MAIN_REPO: ${{ github.workspace }}/main
          FOUNDRY_REPO: ${{ github.repository }}
          FORCE: ${{ inputs.force && '1' || '' }}
          DECOMPOSE_FORCE: ${{ inputs.decompose && '1' || '' }}   # one-shot: force the decompose path
          COMPOSE_PROJECT_NAME: docker    # the tick's daemon<->lean-lsp flip + leanstral-vibe.sh
          VERIFY_CPUSET: "0-1"            # share the 2-core cpuset with the daemon step
        run: bash scripts/pipeline-tick.sh

      - name: Persist state + telemetry
        if: always()
        run: |
          git config user.name "pipeline-bot"
          git config user.email "pipeline@users.noreply.github.com"
          # targets/queue: a self-feeding tick autoformalizes a new stub + entry +
          # manifest into the queue; commit those alongside the state + telemetry.
          git add pipeline_state.json runs targets/queue 2>/dev/null || true
          git diff --cached --quiet && exit 0
          git commit -m "pipeline: state + telemetry + autoformalized targets [skip ci]"
          # The push must survive commits landing on main MID-RUN (2026-07-17: a
          # gate fix landed while a tick ran; `git push || true` swallowed the
          # rejection and orphaned cal-bk-85's state — one tick from a duplicate
          # PR). Rebase-and-retry; if it still cannot land, FAIL the step so the
          # orphaned state is a red run, not a silent one.
          for i in 1 2 3; do
            git push && exit 0
            echo "::warning::persist push rejected (attempt $i) — rebasing onto main and retrying"
            git pull --rebase || true
          done
          echo "::error::persist push FAILED — this run's state/telemetry is NOT on main (recover from the pipeline-runs artifact)"
          exit 1

      - name: Upload telemetry
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: pipeline-runs
          path: runs/
          if-no-files-found: ignore
